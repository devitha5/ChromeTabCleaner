<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Tab cleaner</h1>
    <p id="summary">Loading…</p>
  </header>

  <section class="settings">
    <label class="row"><input type="checkbox" id="autoCleanup" /> Close inactive tabs automatically</label>
    <label class="row"><input type="checkbox" id="protectPinned" /> Never close pinned tabs</label>
    <label class="row">
      Close tabs unused for
      <input type="number" id="thresholdDays" min="0.001" step="any" /> days
    </label>
  </section>

  <section>
    <div class="list-head">
      <h2>Ready to close</h2>
      <button id="cleanNow" disabled>Close 0 tabs</button>
    </div>
    <ul id="candidates"></ul>
  </section>

  <details>
    <summary>All open tabs</summary>
    <ul id="all"></ul>
  </details>

  <script src="popup.js"></script>
</body>
</html>
